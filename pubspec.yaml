name: private_messenger
description: A private messenger with offline mesh support.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Matrix SDK 7.x (ядро мессенджера, включает vodozemac для E2EE)
  matrix: ^7.1.2

  # Утилиты
  cupertino_icons: ^1.0.6
  http: ^1.2.0

  # Медиа
  file_picker: ^8.0.0

  # Web (для Notification API через dart:js_interop)
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
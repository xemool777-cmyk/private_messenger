name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Статический анализ и тесты Flutter
  # ─────────────────────────────────────────────────────────────
  flutter-analyze-test:
    name: Flutter · анализ и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Версия инструментов
        run: |
          flutter --version
          dart --version

      - name: Зависимости
        run: flutter pub get

      - name: Проверка форматирования
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Статический анализ
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Тесты (браузерный раннер — matrix/web не собираются на VM)
        run: flutter test --platform chrome --reporter expanded

  # ─────────────────────────────────────────────────────────────
  # 2. Сборка PWA (web) — единственная целевая платформа проекта
  # ─────────────────────────────────────────────────────────────
  build-web:
    name: Сборка · PWA (web)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: flutter-analyze-test
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Сборка web
        run: flutter build web --release

      - name: Проверка артефактов PWA
        run: |
          set -e
          test -f build/web/manifest.json || { echo "НЕТ manifest.json"; exit 1; }
          test -f build/web/flutter_service_worker.js || { echo "НЕТ service worker"; exit 1; }
          test -f build/web/main.dart.js || { echo "НЕТ main.dart.js"; exit 1; }
          python3 - <<'PYEOF'
          import json, sys
          m = json.load(open("build/web/manifest.json"))
          need = ["name", "short_name", "start_url", "display", "icons"]
          miss = [k for k in need if k not in m]
          if miss:
              print("manifest неполон:", miss); sys.exit(1)
          if m.get("display") != "standalone":
              print("display должен быть standalone, есть:", m.get("display")); sys.exit(1)
          print(f"manifest ок: {m['name']}, display={m['display']}, иконок {len(m['icons'])}")
          PYEOF
          echo "размер сборки: $(du -sh build/web | cut -f1)"

      - name: Выгрузка артефакта PWA
        uses: actions/upload-artifact@v4
        with:
          name: pwa-build
          path: build/web
          retention-days: 14
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 3. Push-гейтвей (Node.js)
  # ─────────────────────────────────────────────────────────────
  push-gateway:
    name: Push-гейтвей · сборка и аудит
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: push-gateway
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: push-gateway/package-lock.json

      - name: Зависимости (строго по lock-файлу)
        run: npm ci

      - name: Синтаксическая проверка
        run: node --check server.js

      - name: Аудит зависимостей
        run: npm audit --audit-level=high

  # ─────────────────────────────────────────────────────────────
  # 4. Проверка на утечку секретов
  # ─────────────────────────────────────────────────────────────
  secret-scan:
    name: Безопасность · поиск секретов
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получение кода (полная история)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверка на секреты
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

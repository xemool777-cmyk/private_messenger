<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Private Messenger — E2EE encrypted chat">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Private Messenger">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Viewport for mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Private Messenger</title>
  <link rel="manifest" href="manifest.json">

  <!-- Olm (E2EE library for Matrix) — загружаем но не блокируем старт -->
  <script src="olm.js"></script>
  <script>
    if (typeof Olm !== 'undefined') {
      Olm.init().then(function() {
        console.log('[Olm] WASM initialized, version: ' + Olm.get_library_version());
        window.__olmReady = true;
      }).catch(function(e) {
        console.error('[Olm] WASM init failed:', e);
        window.__olmReady = false;
      });
    } else {
      console.warn('[Olm] olm.js not loaded');
      window.__olmReady = false;
    }
  </script>

  <!-- Push Helper (Service Worker push subscription + Web Push API) -->
  <script src="push_helper.js"></script>

  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Запускаем Flutter независимо от Olm (E2EE будет работать без Olm или в degraded режиме)
      _flutter.loader.load({
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>

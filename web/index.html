<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Private Messenger — E2EE encrypted chat">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Private Messenger">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Viewport for mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Private Messenger</title>
  <link rel="manifest" href="manifest.json">

  <!-- Диагностика: собираем ошибки страницы, чтобы читать их программно -->
  <script>
    window.__errs = [];
    window.addEventListener('error', function (e) {
      window.__errs.push('error: ' + (e.message || '') + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno);
    });
    window.addEventListener('unhandledrejection', function (e) {
      window.__errs.push('reject: ' + String(e.reason && e.reason.message ? e.reason.message : e.reason));
    });
    // Перехват консоли: print() из Dart и ошибки движка видны программно
    window.__logs = [];
    ['log', 'warn', 'error', 'info'].forEach(function (lvl) {
      var orig = console[lvl].bind(console);
      console[lvl] = function () {
        try {
          window.__logs.push(lvl + ': ' + Array.prototype.map.call(arguments, String).join(' ').slice(0, 300));
          if (window.__logs.length > 200) window.__logs.shift();
        } catch (e) {}
        orig.apply(console, arguments);
      };
    });
  </script>

  <!-- Olm (E2EE library for Matrix) — загружаем но не блокируем старт -->
  <script src="olm.js"></script>
  <script>
    if (typeof Olm !== 'undefined') {
      Olm.init().then(function() {
        console.log('[Olm] WASM initialized, version: ' + Olm.get_library_version());
        window.__olmReady = true;
      }).catch(function(e) {
        console.error('[Olm] WASM init failed:', e);
        window.__olmReady = false;
      });
    } else {
      console.warn('[Olm] olm.js not loaded');
      window.__olmReady = false;
    }
  </script>

  <!-- Push Helper (Service Worker push subscription + Web Push API) -->
  <script src="push_helper.js"></script>

  <!-- Flutter bootstrap — включает flutter.js, buildConfig и auto-call _flutter.loader.load() -->
  <script src="flutter_bootstrap.js" defer></script>

  <!-- PWA: свой service worker (flutter_service_worker.js в 3.41 сам себя удаляет) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js')
          .then(function (reg) {
            console.log('[PWA] service worker зарегистрирован:', reg.scope);
          })
          .catch(function (e) {
            console.error('[PWA] регистрация service worker не удалась:', e);
          });
      });
    }
  </script>
</head>
<body>
</body>
</html>
